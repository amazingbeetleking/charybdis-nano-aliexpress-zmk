draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: false
  small_pad: 2.0
  draw_key_sides: false
  svg_style: |
    svg path { fill: inherit; }
    svg.keymap {
        font-family: Menlo,SFMono-Regular,Consolas,Liberation Mono,monospace;
        font-size: 14px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
        fill: #FFF;
        background: #141F26;
    }
    rect.key { fill: #72878C; stroke: #5A6E73; stroke-width: 1; }
    rect.side { filter: brightness(90%); }
    rect.combo, rect.combo-separate { fill: #54929b; stroke: #007772; }
    rect.held, rect.combo.held { stroke: #A65437; fill: #BF9278; line-height: 2; }
    rect.ghost, rect.combo.ghost { stroke-dasharray: 4, 4; stroke-width: 2; }
    text { text-anchor: middle; dominant-baseline: middle; }
    text.label { text-anchor: start; stroke: white; paint-order: stroke; }
    text.combo, text.hold, text.shifted { font-size: 11px; }
    text.hold { text-anchor: middle; dominant-baseline: auto; }
    text.shifted { text-anchor: middle; dominant-baseline: hanging; }
    text.combo.hold, text.combo.shifted { font-size: 8px; }
    text.trans { fill: #2C3A40; }
    path.combo { stroke-width: 1; stroke:#A65437; fill: none; }
    .icon-tabler > path { fill: inherit; stroke: inherit; stroke-width: 2; }
    .icon-tabler > path[stroke="none"][fill="none"] { visibility: hidden; }
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
  glyph_urls:
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    tabler: https://unpkg.com/@tabler/icons/icons/{}.svg
  use_local_cache: true
parse_config:
  preprocess: true

  # === Переопределяем названия модификаторов (чтобы было "Ctrl", не "Ctl") ===
  mod_legend_map:
    LCTRL: Ctrl
    LSHIFT: Shift
    LSHFT: Shift
    LALT: Alt
    LGUI: Cmd
    RCTRL: Ctrl
    RSHIFT: Shift
    RSHFT: Shift
    RALT: Alt
    RGUI: Cmd

  # === Маппинг для комбинаций модификаторов + навигационные клавиши ===
  # Keymap-drawer не умеет автоматически склеивать модификатор + стрелку,
  # поэтому перехватываем сырые биндинги и возвращаем простую строку.
  # Строка отрисовывается горизонтально по центру клавиши.
  raw_binding_map:
    # Ctrl + стрелки
    "&kp LC(DOWN)": "Ctrl+↓"
    "&kp LC(UP)": "Ctrl+↑"
    "&kp LC(LEFT)": "Ctrl+←"
    "&kp LC(RIGHT)": "Ctrl+→"
    # Shift + стрелки
    "&kp LS(DOWN)": "Shift+↓"
    "&kp LS(UP)": "Shift+↑"
    "&kp LS(LEFT)": "Shift+←"
    "&kp LS(RIGHT)": "Shift+→"
    # Alt + стрелки
    "&kp LA(DOWN)": "Alt+↓"
    "&kp LA(UP)": "Alt+↑"
    "&kp LA(LEFT)": "Alt+←"
    "&kp LA(RIGHT)": "Alt+→"
    # GUI/Cmd + стрелки
    "&kp LG(DOWN)": "Cmd+↓"
    "&kp LG(UP)": "Cmd+↑"
    "&kp LG(LEFT)": "Cmd+←"
    "&kp LG(RIGHT)": "Cmd+→"
    # Ctrl + другие навигационные клавиши
    "&kp LC(HOME)": "Ctrl+Home"
    "&kp LC(END)": "Ctrl+End"
    "&kp LC(PG_UP)": "Ctrl+PgUp"
    "&kp LC(PG_DN)": "Ctrl+PgDn"
    "&kp LC(INSERT)": "Ctrl+Ins"
    "&kp LC(DEL)": "Ctrl+Del"
    "&kp LC(BSPC)": "Ctrl+Bksp"
    # Shift + другие навигационные клавиши
    "&kp LS(HOME)": "Shift+Home"
    "&kp LS(END)": "Shift+End"
    "&kp LS(PG_UP)": "Shift+PgUp"
    "&kp LS(PG_DN)": "Shift+PgDn"
    "&kp LS(DEL)": "Shift+Del"
    "&kp LS(BSPC)": "Shift+Bksp"
    # Alt + другие навигационные клавиши
    "&kp LA(HOME)": "Alt+Home"
    "&kp LA(END)": "Alt+End"
    "&kp LA(DEL)": "Alt+Del"
    "&kp LA(BSPC)": "Alt+Bksp"
    # GUI + другие навигационные клавиши
    "&kp LG(HOME)": "Cmd+Home"
    "&kp LG(END)": "Cmd+End"
    "&kp LG(DEL)": "Cmd+Del"
    "&kp LG(BSPC)": "Cmd+Bksp"
    # Двойные модификаторы + стрелки
    "&kp LC(LA(DOWN))": "Ctrl+Alt+↓"
    "&kp LC(LA(UP))": "Ctrl+Alt+↑"
    "&kp LC(LA(LEFT))": "Ctrl+Alt+←"
    "&kp LC(LA(RIGHT))": "Ctrl+Alt+→"
    "&kp LC(LS(DOWN))": "Ctrl+Shift+↓"
    "&kp LC(LS(UP))": "Ctrl+Shift+↑"
    "&kp LC(LS(LEFT))": "Ctrl+Shift+←"
    "&kp LC(LS(RIGHT))": "Ctrl+Shift+→"
    "&kp LA(LS(DOWN))": "Alt+Shift+↓"
    "&kp LA(LS(UP))": "Alt+Shift+↑"
    "&kp LA(LS(LEFT))": "Alt+Shift+←"
    "&kp LA(LS(RIGHT))": "Alt+Shift+→"

  zmk_keycode_map:
    LCTRL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    LGUI: $$mdi:apple-keyboard-command$$
    RCTRL: $$mdi:apple-keyboard-control$$
    RALT: $$mdi:apple-keyboard-option$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RGUI: $$mdi:apple-keyboard-command$$
    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DEL: $$mdi:backspace-reverse-outline$$
    DELETE: $$mdi:backspace-reverse-outline$$
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$
    C_PP: $$mdi:play-pause$$
    C_MUTE: $$mdi:volume-off$$
    # Symbols
    MINUS: '-'
    EQUAL: '='
    EQL: '='
    PLUS: '+'
    UNDERSCORE: '_'
    UNDER: '_'
    LEFT_BRACKET: '['
    LBKT: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBKT: ']'
    RBRC: ']'
    LEFT_BRACE: '{'
    LCBR: '{'
    RIGHT_BRACE: '}'
    RCBR: '}'
    BACKSLASH: '\'
    BSLH: '\'
    PIPE: '|'
    SEMICOLON: ';'
    SEMI: ';'
    COLON: ':'
    SINGLE_QUOTE: "'"
    SQT: "'"
    APOS: "'"
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    DOT: '.'
    PERIOD: '.'
    SLASH: '/'
    FSLH: '/'
    QUESTION: '?'
    QMARK: '?'
    GRAVE: '`'
    TILDE: '~'
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: '$'
    DLLR: '$'
    PERCENT: '%'
    PRCNT: '%'
    CARET: '^'
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    ASTR: '*'
    LEFT_PARENTHESIS: '('
    LPAR: '('
    RIGHT_PARENTHESIS: ')'
    RPAR: ')'
    LEFT_ANGLE_BRACKET: '<'
    LT: '<'
    RIGHT_ANGLE_BRACKET: '>'
    GT: '>'
  trans_legend:
    t: ▽
    type: trans
